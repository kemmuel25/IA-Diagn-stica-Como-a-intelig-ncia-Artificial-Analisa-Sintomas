<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <title>IA Diagnóstica — Educacional</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Config Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1'
                    }
                }
            }
        }
    </script>

    <!-- Estilo próprio -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-5">

    <div class="max-w-2xl mx-auto mt-10 p-6 bg-gray-800 rounded-xl shadow-xl">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-primary">IA Diagnóstica (Educacional)</h1>

            <!-- Botão para trocar tema -->
            <button id="themeToggle" 
                class="px-3 py-1 bg-primary text-white rounded-lg hover:opacity-90">
                Alternar Tema
            </button>
        </div>

        <p class="mb-4 text-gray-300">
            Descreva seus sintomas para simular como um sistema de IA faz análises simples.
            <br>
            <strong class="text-yellow-400">Este sistema é apenas educativo.</strong>
        </p>

        <textarea id="inputSintomas"
            class="w-full h-40 p-4 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Ex: febre, dor de cabeça, náusea..."
        ></textarea>

        <button onclick="analisar()"
            class="w-full mt-4 bg-primary py-3 rounded-lg text-lg font-semibold hover:opacity-90">
            Analisar sintomas
        </button>

        <!-- Resultado -->
        <div id="resultado" class="mt-6 hidden p-4 bg-gray-700 rounded-lg"></div>
    </div>

    <script>
        function analisar() {
            const texto = document.getElementById("inputSintomas").value.toLowerCase().trim();
            const box = document.getElementById("resultado");

            if (!texto) {
                box.classList.remove("hidden");
                box.innerHTML = `<p class='text-red-400'>Digite algum sintoma antes.</p>`;
                return;
            }

            let resposta = "Os sintomas não correspondem a nenhum padrão simples do sistema.";

            const regras = [
                {
                    cond: texto.includes("febre") && texto.includes("dor"),
                    msg: "Pode estar relacionado a um quadro infeccioso leve."
                },
                {
                    cond: texto.includes("tosse") && texto.includes("catarro"),
                    msg: "Pode sugerir irritação ou inflamação respiratória."
                },
                {
                    cond: texto.includes("náusea") || texto.includes("vomito"),
                    msg: "Pode indicar desconforto gastrointestinal."
                },
                {
                    cond: texto.includes("falta de ar") || texto.includes("dor no peito"),
                    msg: "Sinais que merecem atenção imediata — procure atendimento."
                }
            ];

            for (let r of regras) {
                if (r.cond) {
                    resposta = r.msg;
                    break;
                }
            }

            box.classList.remove("hidden");
            box.innerHTML = `
                <h2 class="text-xl font-bold mb-2 text-primary">Resultado</h2>
                <p class="mb-2"><strong>Sintomas informados:</strong> ${texto}</p>
                <p class="text-gray-200"><strong>Interpretação:</strong> ${resposta}</p>
                <p class="mt-4 text-yellow-300 text-sm">
                    *Este sistema é apenas educativo e não substitui profissionais de saúde.*
                </p>
            `;
        }

        // Alternar tema
        document.getElementById("themeToggle").addEventListener("click", () => {
            document.documentElement.classList.toggle("dark");

            // ajustar fundo ao modo claro
            if (document.documentElement.classList.contains("dark")) {
                document.body.classList.add("bg-gray-900", "text-gray-100");
                document.body.classList.remove("bg-gray-100", "text-gray-900");
            } else {
                document.body.classList.add("bg-gray-100", "text-gray-900");
                document.body.classList.remove("bg-gray-900", "text-gray-100");
            }
        });
    </script>

</body>
</html>
