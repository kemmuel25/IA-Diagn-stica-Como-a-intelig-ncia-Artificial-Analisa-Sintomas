<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>IA Diagnóstica — Zero Dependências</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;max-width:900px;margin:20px auto;padding:10px}
    .card{border:1px solid #ddd;padding:12px;border-radius:8px;margin:12px 0}
    .urgent{color:#b00000;font-weight:bold}
    .warning{background:#fff3cd;padding:10px;border-radius:6px;color:#7a5a00;margin-bottom:15px}
    button{padding:10px 16px;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>

  <h1>IA Diagnóstica — Simulador Educativo (100% HTML + JS)</h1>
  <p class="warning"><strong>Aviso:</strong> Este projeto é educativo e não fornece diagnóstico médico.</p>

  <div class="card">
    <h3>Selecione os sintomas:</h3>
    <form id="formSymptoms">
      <label><input type="checkbox" name="symptom" value="febre"> Febre</label><br>
      <label><input type="checkbox" name="symptom" value="dor_de_cabeca"> Dor de cabeça</label><br>
      <label><input type="checkbox" name="symptom" value="cansaco"> Cansaço</label><br>
      <label><input type="checkbox" name="symptom" value="tosse"> Tosse</label><br>
      <label><input type="checkbox" name="symptom" value="catarro"> Catarro</label><br>
      <label><input type="checkbox" name="symptom" value="dor_intensa"> Dor intensa</label><br>
      <label><input type="checkbox" name="symptom" value="vomito"> Vômito</label><br>
      <label><input type="checkbox" name="symptom" value="falta_de_ar"> Falta de ar</label><br>
      <label><input type="checkbox" name="symptom" value="dor_no_peito"> Dor no peito</label><br>
      <label><input type="checkbox" name="symptom" value="nausea"> Náusea</label><br>
    </form>

    <button onclick="runAnalysis()">Analisar</button>
  </div>

  <div id="result"></div>

<script>
  // Base de padrões (educacional)
  const PATTERNS = [
    { 
      name: "Infecção viral",
      conditions: ["febre","dor_de_cabeca","cansaco"],
      urgency: "Baixa",
      explanation: "Combinação típica de infecções virais leves."
    },
    { 
      name: "Infecção respiratória",
      conditions: ["tosse","febre","catarro"],
      urgency: "Média",
      explanation: "Pode indicar infecção respiratória."
    },
    { 
      name: "Gastroenterite",
      conditions: ["dor_intensa","vomito"],
      urgency: "Média",
      explanation: "Dor intensa com vômito pode ser gastroenterite."
    },
    { 
      name: "Emergência",
      conditions: ["falta_de_ar","dor_no_peito"],
      urgency: "Alta",
      explanation: "Sinais de alerta importantes."
    }
  ];

  function runAnalysis(){
    const form = document.querySelectorAll('input[name="symptom"]:checked');
    const selected = Array.from(form).map(i=>i.value);

    const resultBox = document.getElementById("result");
    if(selected.length === 0){
      resultBox.innerHTML = "<p>Nenhum sintoma selecionado.</p>";
      return;
    }

    let matches = [];

    PATTERNS.forEach(p=>{
      const overlap = p.conditions.filter(c=>selected.includes(c)).length;
      if(overlap > 0){
        matches.push({
          pattern: p,
          overlap,
          score: overlap / p.conditions.length
        });
      }
    });

    matches.sort((a,b)=> b.score - a.score);

    const urgMap = { "Baixa":1,"Média":2,"Alta":3 };
    let level = 1;

    matches.forEach(m=>{
      const u = urgMap[m.pattern.urgency];
      if(u > level) level = u;
    });

    const triage = {
      1: "Leve",
      2: "Moderada",
      3: "Alta"
    }[level];

    const rec = [
      "Descansar e beber água.",
      "Buscar atendimento se os sintomas piorarem.",
      "Resultado educacional — não é diagnóstico."
    ];

    if(selected.includes("falta_de_ar") || selected.includes("dor_no_peito")){
      rec.unshift("⚠️ Sinal de alerta: procure emergência imediatamente.");
    }

    let html = `<div class="card">
      <h3>Sintomas selecionados:</h3>
      <ul>${selected.map(s=>"<li>"+s.replaceAll("_"," ")+"</li>").join("")}</ul>
      <p><strong>Nível de atenção:</strong> <span class="urgent">${triage}</span></p>
    </div>`;

    if(matches.length > 0){
      html += `<div class="card"><h3>Possíveis hipóteses (educacional)</h3><ol>`;
      matches.slice(0,2).forEach(m=>{
        html += `<li><strong>${m.pattern.name}</strong> — confiança ${(m.score*100).toFixed(0)}%<br>${m.pattern.explanation}</li>`;
      });
      html += "</ol></div>";
    }

    html += `<div class="card"><h3>Recomendações gerais</h3><ul>${
      rec.map(r=>"<li>"+r+"</li>").join("")
    }</ul></div>`;

    resultBox.innerHTML = html;
  }
</script>

</body>
</html>
